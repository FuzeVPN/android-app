name: fuzevpn_android
description: Client Android officiel de FuzeVPN.
publish_to: none
version: 0.2.5+74011

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  crypto: 3.0.7
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/flags/
    - assets/licenses/
    - assets/images/fuzevpn-emblem.png
    - assets/images/google-g.png
    - assets/fonts/Archivo-OFL.txt
    - assets/fonts/IBMPlexMono-OFL.txt
    - assets/fonts/NotoSansArabic-OFL.txt
    - assets/fonts/GoogleSans-OFL.txt
    - assets/fonts/GoogleSans-TRADEMARKS.md
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Variable.ttf
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
